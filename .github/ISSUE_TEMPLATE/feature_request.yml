name: Feature idea
description: Suggest a new check, page, action or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the thing you want to see or manage.
      placeholder: "I'd like to see which skills are the biggest so I can trim my context."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. A rough idea is fine.
  - type: checkboxes
    id: help
    attributes:
      label: Want to build it?
      options:
        - label: I'd like to open a pull request for this myself
